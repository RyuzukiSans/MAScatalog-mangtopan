<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - MAScatalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#F4F6F0] relative overflow-hidden">
  <!-- Background blobs -->
  <div class="absolute -top-32 -right-32 w-[500px] h-[500px] bg-[#B5C58C]/40 rounded-full blur-[80px]"></div>
  <div class="absolute -bottom-32 -left-32 w-[500px] h-[500px] bg-[#A3B18A]/30 rounded-full blur-[80px]"></div>

  <div class="w-full max-w-[420px] relative">
    <div class="glass-strong rounded-[32px] p-8 md:p-10 shadow-[0_32px_80px_rgba(45,58,39,0.15)]">
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl matcha-gradient mx-auto flex items-center justify-center text-white font-extrabold text-xl shadow-lg">F</div>
        <h1 class="mt-4 font-extrabold text-[22px] tracking-tight">Masuk Dashboard</h1>
        <p class="text-sm opacity-60 mt-1">Kelola katalog buku MAScatalog</p>
      </div>

      <div id="demo-info" class="hidden mb-6 p-3 rounded-xl bg-[#B5C58C]/20 border border-[#B5C58C]/40 text-xs">
        <p class="font-bold flex items-center gap-1.5"><i data-lucide="info" class="w-3.5 h-3.5"></i> Demo Mode Aktif</p>
        <p class="opacity-70 mt-1">Username: <code class="px-1.5 py-0.5 rounded bg-[#2D3A27] text-white font-bold">fuad</code> Password: <code class="px-1.5 py-0.5 rounded bg-[#2D3A27] text-white font-bold">123</code></p>
      </div>

      <div id="login-alert" class="hidden mb-5 p-3 rounded-xl text-sm font-medium"></div>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="text-xs font-bold opacity-70 tracking-wide uppercase">Username</label>
          <div class="mt-2 relative">
            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 opacity-40"></i>
            <input id="username" type="text" placeholder="fuad" required autocomplete="username" class="search-glass w-full pl-11 pr-4 py-3.5 rounded-full text-sm">
          </div>
        </div>
        <div>
          <label class="text-xs font-bold opacity-70 tracking-wide uppercase">Password</label>
          <div class="mt-2 relative">
            <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 opacity-40"></i>
            <input id="password" type="password" placeholder="••••" required autocomplete="current-password" class="search-glass w-full pl-11 pr-4 py-3.5 rounded-full text-sm">
          </div>
        </div>
        <button type="submit" class="w-full h-12 rounded-full bg-[#2D3A27] text-white font-bold flex items-center justify-center gap-2 hover:bg-[#1f291b] transition shadow-[0_8px_24px_rgba(45,58,39,0.25)] disabled:opacity-70">
          Masuk <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-[#C9D6BF]/50 text-center">
        <a href="../index.html" class="text-xs opacity-60 hover:opacity-100 inline-flex items-center gap-1"><i data-lucide="arrow-left" class="w-3 h-3"></i> Kembali ke Katalog</a>
      </div>
    </div>

    <p class="text-center text-[11px] opacity-40 mt-6">© 2026 MAScatalog • Secure Admin Access</p>
  </div>

  <script type="module" src="../js/admin.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
