<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="Detail buku MAScatalog">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Detail Buku - MAScatalog">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:description" content="Katalog buku karya Taufan Fuad Ramadan, M.A.">

  <link id="dynamic-favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232D3A27'/><text y='72' x='50' font-size='62' font-family='Arial' font-weight='bold' fill='%23B5C58C' text-anchor='middle'>F</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { matcha: { soft: '#B5C58C', earthy: '#A3B18A', milky: '#C9D6BF', light: '#F4F6F0', dark: '#2D3A27' } } } } }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @media (max-width: 768px) {
      html, body {
        overflow-y: auto !important;
        height: auto !important;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y !important;
      }
      .mobile-app-container {
        padding-left: 12px;
        padding-right: 12px;
      }
      .tap-scale:active { transform: scale(0.97); transition: transform 0.1s; }
    }
    .scrollbar-none::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#F4F6F0] antialiased overflow-x-hidden detail-page">

  <header id="detail-header" class="sticky top-0 z-30 glass-strong border-b border-white/40">
    <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 md:py-3.5 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5 min-w-0 tap-scale">
        <span class="w-9 h-9 md:w-8 md:h-8 rounded-full bg-[#2D3A27] text-white flex items-center justify-center flex-shrink-0"><i data-lucide="arrow-left" class="w-4 h-4"></i></span>
        <div class="hidden md:block min-w-0">
          <h1 id="logo-text-detail" class="font-extrabold text-[16px] leading-none truncate">MAScatalog</h1>
          <p class="text-[10px] opacity-60">Kembali ke Katalog</p>
        </div>
        <span class="md:hidden font-bold text-[15px]">Detail Buku</span>
      </a>
      <div class="flex items-center gap-2 flex-shrink-0">
        <button id="share-btn" class="h-10 md:h-9 px-3.5 md:px-3 rounded-full glass flex items-center justify-center gap-1.5 hover:bg-[#2D3A27] hover:text-white transition text-xs font-bold tap-scale">
          <i data-lucide="link" class="w-4 h-4 md:w-3.5 md:h-3.5"></i> <span>Salin</span>
        </button>
      </div>
    </div>
  </header>

  <div id="detail-skeleton" class="max-w-7xl mx-auto px-4 md:px-6 py-6">
    <div class="grid md:grid-cols-[420px_1fr] gap-8">
      <div class="book-ratio rounded-[24px] shimmer"></div>
      <div class="space-y-4"><div class="h-8 shimmer rounded w-3/4"></div><div class="h-4 shimmer rounded"></div><div class="h-32 shimmer rounded-[16px]"></div></div>
    </div>
  </div>

  <div id="detail-content" class="hidden max-w-7xl mx-auto px-3 md:px-6 py-4 md:py-6 pb-[140px] md:pb-6 w-full mobile-app-container">
    <div class="grid md:grid-cols-[440px_1fr] lg:grid-cols-[480px_1fr] gap-4 md:gap-10 items-start w-full">

      <div class="md:sticky md:top-[84px] w-full min-w-0">
        <div class="swiper mySwiper rounded-[20px] md:rounded-[24px] overflow-hidden bg-white shadow-[0_20px_60px_rgba(45,58,39,0.12)] w-full">
          <div class="swiper-wrapper" id="swiper-wrapper"></div>
          <div class="swiper-pagination !bottom-4"></div>
        </div>
        <div class="mt-3 md:mt-4 hidden md:flex gap-2">
          <div class="glass px-3 py-1.5 rounded-full text-[11px] font-medium flex items-center gap-1.5"><i data-lucide="move-horizontal" class="w-3 h-3"></i> Geser untuk lihat sampel</div>
          <div class="glass px-3 py-1.5 rounded-full text-[11px] font-medium">Cover → Isi → Belakang</div>
        </div>
      </div>

      <div class="w-full min-w-0">
        <div class="glass rounded-[20px] md:rounded-[24px] p-4 md:p-8">
          <div class="flex items-center gap-2 mb-2 md:mb-3 flex-wrap">
            <span id="book-category" class="px-2.5 py-0.5 md:px-3 md:py-1 rounded-full text-[10px] md:text-[11px] font-bold bg-[#2D3A27] text-white tracking-wide">KATEGORI</span>
            <span class="px-2.5 py-0.5 md:px-3 md:py-1 rounded-full text-[10px] md:text-[11px] font-medium bg-[#B5C58C]/30 text-[#2D3A27]">Best Seller</span>
          </div>
          <h1 id="book-title" class="text-[20px] md:text-[32px] font-extrabold leading-[1.2] md:leading-[1.15] tracking-tight break-words">Judul Buku</h1>
          <p id="book-short" class="text-[13px] md:text-sm opacity-70 mt-2 md:mt-3 leading-relaxed break-words">Deskripsi singkat buku...</p>
          <div class="mt-4 md:mt-6 flex items-baseline gap-3 flex-wrap">
            <span id="book-price" class="text-[24px] md:text-[28px] font-extrabold">Rp 0</span>
          </div>
          <a id="order-btn" href="#" target="_blank" rel="noopener" class="hidden md:flex mt-6 w-full h-14 rounded-full bg-[#2D3A27] text-white font-bold items-center justify-center gap-2 hover:bg-[#1f291b] transition">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i> Order
          </a>
        </div>

        <!-- ============ TAB CONTAINER (FIXED v11.2) ============
             - class "detail-tabs-container" untuk parent TANPA overflow-hidden di mobile
             - wrapper tab di dalam dengan sticky
        -->
        <div class="mt-4 md:mt-6 detail-tabs-container">
          <!-- TABS WRAPPER — sticky di mobile, static di desktop -->
          <div id="detail-tabs" class="detail-tabs-wrapper flex border-b border-[#C9D6BF]/60 overflow-x-auto scrollbar-none">
            <button data-tab="synopsis" class="tab-btn active">Sinopsis</button>
            <button data-tab="specs" class="tab-btn">Spesifikasi</button>
            <button data-tab="features" class="tab-btn">Keistimewaan</button>
            <button data-tab="bio" class="tab-btn">Biografi</button>
          </div>
          <!-- TAB PANE -->
          <div class="detail-tab-pane p-4 md:p-8 md:min-h-[280px]">
            <div id="tab-synopsis" class="tab-pane text-[13.5px] md:text-sm leading-relaxed break-words"></div>
            <div id="tab-specs" class="tab-pane hidden"></div>
            <div id="tab-features" class="tab-pane hidden"></div>
            <div id="tab-bio" class="tab-pane hidden"></div>
          </div>
        </div>

        <div id="recommendation-section" class="mt-6 md:mt-8">
          <h3 class="font-extrabold text-[16px] md:text-[18px] mb-3 md:mb-4 flex items-center gap-2"><span class="w-1 h-5 rounded-full bg-[#2D3A27]"></span> Buku Terbaru Lainnya</h3>
          <div id="recommendation-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="md:hidden fixed bottom-0 left-0 right-0 z-30 sticky-cta px-4 pt-3 flex items-center gap-3" style="padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));">
    <div class="flex-1 min-w-0">
      <p class="text-[11px] opacity-60 leading-none">Harga</p>
      <p id="order-price-mobile" class="font-extrabold text-[16px] truncate">Rp 0</p>
    </div>
    <a id="order-btn-mobile" href="#" target="_blank" rel="noopener" class="flex-1 h-12 rounded-full bg-[#2D3A27] text-white font-bold text-sm flex items-center justify-center gap-2 shadow-[0_8px_24px_rgba(45,58,39,0.3)] tap-scale">
      <i data-lucide="shopping-bag" class="w-4 h-4"></i> Order Sekarang
    </a>
  </div>

  <footer class="border-t border-[#C9D6BF]/50 bg-white/50 backdrop-blur mt-8 md:mt-10 mb-[110px] md:mb-0">
    <div class="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-8 flex flex-col md:flex-row justify-between gap-4 items-center">
      <div class="flex items-center gap-2">
        <div id="footer-logo-fallback-detail" class="w-7 h-7 rounded-full matcha-gradient flex items-center justify-center text-white font-bold text-xs">F</div>
        <img id="footer-logo-img-detail" src="" alt="Logo" class="hidden w-7 h-7 rounded-full object-cover">
        <span id="footer-logo-text-detail" class="font-extrabold text-sm">MAScatalog</span>
      </div>
      <p class="text-[11px] md:text-xs opacity-60 text-center md:text-left">© 2026 MAScatalog • Personal Book Catalog</p>
      <div id="footer-socials-detail" class="flex gap-2 flex-wrap"></div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script type="module" src="js/detail.js"></script>
  <script>
    // ============ AUTO-SET HEADER HEIGHT (v11.2) ============
    (function(){
      function setHeaderHeight() {
        const h = document.getElementById('detail-header');
        if (!h) return;
        const height = Math.ceil(h.getBoundingClientRect().height);
        document.documentElement.style.setProperty('--header-h-mobile', height + 'px');
      }
      window.addEventListener('load', setHeaderHeight);
      document.addEventListener('DOMContentLoaded', setHeaderHeight);
      window.addEventListener('resize', setHeaderHeight);
      window.addEventListener('orientationchange', () => setTimeout(setHeaderHeight, 200));
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(setHeaderHeight);
      }
      setTimeout(setHeaderHeight, 100);
      setTimeout(setHeaderHeight, 500);
      setTimeout(setHeaderHeight, 1500);
    })();

    function safeCreateIcons(){ try{ if(window.lucide && lucide.createIcons) lucide.createIcons(); } catch(e){} }
    window.addEventListener('load', safeCreateIcons);
    setTimeout(safeCreateIcons, 500);
  </script>
</body>
</html>
